name: Windows Desktop Release

# Separate release channel from the PyPI CalVer tags (v20*): the desktop app
# has its own SemVer versioning (apps/windows/Fetih.Desktop/Fetih.Desktop.csproj
# <Version>), tagged "desktop-vX.Y.Z" so the two release streams never collide
# on the same GitHub Releases page. UpdateService.cs (in-app auto-update)
# looks for exactly this tag prefix.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      confirm_tag:
        description: 'Tag to build (e.g. desktop-v1.2.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer + portable package
    runs-on: windows-latest
    permissions:
      contents: write  # create/update the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.confirm_tag || github.ref }}
          fetch-tags: true

      - name: Validate tag exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if ! git tag -l "${{ inputs.confirm_tag }}" | grep -q .; then
            echo "::error::Tag '${{ inputs.confirm_tag }}' does not exist in the repo"
            exit 1
          fi

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          tag="${{ inputs.confirm_tag || github.ref_name }}"
          version="${tag#desktop-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' does not resolve to a SemVer version (expected desktop-vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Publish Fetih.Desktop (win-x64)
        shell: pwsh
        run: |
          dotnet publish apps/windows/Fetih.Desktop/Fetih.Desktop.csproj `
            -c Release -r win-x64 --no-self-contained `
            -o dist/win-x64 `
            -p:EnableMsixTooling=true `
            -p:Version=${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          & packaging/windows/build-installer.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -SkipPublish

      - name: Stage portable package
        shell: pwsh
        run: |
          $portable = "dist/portable/Fetih"
          New-Item -ItemType Directory -Path $portable -Force | Out-Null

          # Mirror packaging/windows/installer.iss's [Files] section so the
          # portable zip and the installer ship identical contents.
          Copy-Item "dist/win-x64/*" -Destination $portable -Recurse -Force
          Copy-Item "skills" -Destination "$portable/skills" -Recurse -Force
          Copy-Item "optional-skills" -Destination "$portable/optional-skills" -Recurse -Force
          Copy-Item "fetih_cli" -Destination "$portable/fetih_cli" -Recurse -Force
          Copy-Item "fetih_desktop_bridge" -Destination "$portable/fetih_desktop_bridge" -Recurse -Force
          Copy-Item "agent" -Destination "$portable/agent" -Recurse -Force
          Copy-Item "tools" -Destination "$portable/tools" -Recurse -Force
          Copy-Item "providers" -Destination "$portable/providers" -Recurse -Force
          Copy-Item "*.py" -Destination $portable -Force
          Copy-Item "packaging/windows/fetih.cmd" -Destination "$portable/fetih.cmd" -Force

          # Marker file: UpdateService / a future "how was this installed?"
          # check can use this to tell a portable checkout apart from one
          # made by hand from a debug build.
          Set-Content -Path "$portable/.portable" -Value "FETIH portable build ${{ steps.version.outputs.version }}"

          $zipPath = "dist/installer/Fetih-Portable-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path "$portable/*" -DestinationPath $zipPath -Force

      - name: List release assets
        shell: pwsh
        run: Get-ChildItem dist/installer | Select-Object Name, Length

      - name: Create/update GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/installer/*.exe dist/installer/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/installer/*.exe dist/installer/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "FETİH Desktop v$version" \
              --generate-notes
          fi
